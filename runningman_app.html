<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>런닝맨_신입 운영 앱</title>
<style>
*{box-sizing:border-box;margin:0}
:root{--navy:#3E4A24;--ink:#1F2937;--yellow:#FFD400;--line:#E5E7EB}
*{font-weight:400 !important}
body{font-family:'나눔고딕 ExtraBold','NanumGothic ExtraBold','Nanum Gothic','Malgun Gothic',sans-serif;color:var(--ink);background:#fff;min-height:100vh}
#bar{position:sticky;top:0;z-index:5;background:var(--navy);display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap;align-items:center}
#bar b{color:var(--yellow);font-size:18px;margin-right:10px}
#bar a{color:#fff;text-decoration:none;font-weight:700;font-size:15px;padding:7px 14px;border-radius:20px;background:#ffffff22}
#bar a.on{background:var(--yellow);color:var(--navy)}
main{max-width:980px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:34px;font-weight:900;color:var(--navy)}
.sub{color:#6B7280;font-size:17px;margin:6px 0 22px;font-weight:600}
.row{display:grid;grid-template-columns:44px 1fr 150px 120px;gap:12px;align-items:center;padding:12px 14px;border:2px solid var(--line);border-radius:16px;margin-bottom:10px}
.row.g1b{grid-template-columns:44px 1fr 1fr 150px 90px}
.dot{width:36px;height:36px;border-radius:50%;border:3px solid #1F293722}
input[type=text]{font:inherit;font-size:18px;font-weight:800;padding:8px 12px;border:2px solid var(--line);border-radius:12px;width:100%}
input[type=text]:focus,select:focus{outline:3px solid var(--yellow);border-color:#999}
select{font:inherit;font-size:18px;font-weight:800;padding:8px 10px;border:2px solid var(--line);border-radius:12px;width:100%;background:#fff}
.pts{font-size:26px;font-weight:900;text-align:right;color:var(--navy)}
.pts small{font-size:14px;color:#6B7280}
.warn{color:#E5322D;font-weight:800;font-size:14px;margin:4px 0 12px;min-height:18px}
.btn{font:inherit;font-weight:900;font-size:18px;padding:12px 24px;border:0;border-radius:14px;background:var(--navy);color:#fff;cursor:pointer}
.btn.y{background:var(--yellow);color:var(--navy)}
.btn.g{background:#E5E7EB;color:var(--ink)}
.btn:active{transform:translateY(2px)}
.ladder{display:flex;gap:8px;margin:0 0 22px;flex-wrap:wrap}
.ladder span{background:#F3F4F6;border-radius:12px;padding:6px 12px;font-weight:800;font-size:15px}
.ladder span b{color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:20px}
th{background:var(--navy);color:#fff;padding:12px 8px;font-size:16px}
th:first-child{border-radius:12px 0 0 0}th:last-child{border-radius:0 12px 0 0}
td{padding:12px 8px;text-align:center;border-bottom:2px solid var(--line);font-weight:700}
td.nm{text-align:left;font-weight:900}
td.tot{font-size:28px;font-weight:900;color:var(--navy)}
td.rk{font-size:26px;font-weight:900}
tr.hide td{visibility:hidden}
tr.first td{background:#FFF8CC}
.chip{display:inline-block;width:18px;height:18px;border-radius:50%;margin-right:8px;vertical-align:-2px;border:2px solid #1F293722}
.bar{height:14px;background:#EEF0F4;border-radius:7px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%}
.ctl{display:flex;gap:10px;margin:20px 0;flex-wrap:wrap}
/* timer */
#tm{text-align:center;padding-top:10px}
#clock{font-size:min(30vw,260px);font-weight:900;color:var(--navy);line-height:1;font-variant-numeric:tabular-nums;margin:20px 0}
#clock.end{color:#E5322D;animation:bl .5s steps(2) infinite}
@keyframes bl{50%{opacity:.25}}
.sel{display:flex;gap:12px;justify-content:center;margin:14px 0}
.sel .btn{font-size:26px;padding:14px 36px}
.sel .btn.on{background:var(--yellow);color:var(--navy)}
/* winner overlay */
#win{position:fixed;inset:0;background:#fff;z-index:20;display:none;align-items:center;justify-content:center;overflow:hidden;cursor:pointer}
#win.show{display:flex}
#stage{position:relative;width:min(92vw,1100px);height:min(92vh,720px);display:flex;align-items:center;justify-content:center;transform:scale(.25);}
#win.go #stage{animation:grow 4s ease-out forwards, shake 1s ease-in-out 4.1s 4}
@keyframes grow{to{transform:scale(1)}}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
#stage img.logo{position:absolute;height:92%;opacity:.28}
#stage img.cup{position:absolute;right:0;bottom:0;height:46%;mix-blend-mode:multiply}
#wn{position:relative;font-size:min(14vw,150px);font-weight:900;color:var(--navy);text-align:center;line-height:1.1;text-shadow:0 0 12px #fff,0 0 24px #fff}
#wn small{display:block;font-size:.3em;color:#B45309;margin-bottom:.2em}
#cf{position:fixed;inset:0;pointer-events:none;z-index:21}
</style></head>

<script>
const COL=['#E5322D','#FF9F1A','#FFD400','#2ECC71','#2E86DE','#A55EEA'];
const CN=['빨강','주황','노랑','초록','파랑','보라'];
const PTS=[0,100,80,60,40,20,5];
const PTS3=[0,500,300,200,100,50,10];
const tbl=g=>g==='g3'?PTS3:PTS;
const GAMES={g1a:'무지개를 찾아라 순위',g1b:'조 이름·구호 완성 순위',g2:'이심전심 순위',g3:'상상 네컷 순위'};
const K='rm_state_v1';
let S;
function fresh(){return{names:CN.map(c=>c+'조'),slog:['','','','','',''],r:{g1a:Array(6).fill(0),g1b:Array(6).fill(0),g2:Array(6).fill(0),g3:Array(6).fill(0)}}}
function load(){try{S=JSON.parse(localStorage.getItem(K))||fresh()}catch(e){S=S||fresh()}}
function save(){try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}}
load();window.addEventListener('storage',()=>{load();render()});
const pt=(g,i)=>tbl(g)[S.r[g][i]]||0;
const tot=(i,withG3)=>pt('g1a',i)+pt('g1b',i)+pt('g2',i)+(withG3?pt('g3',i):0);
const $=s=>document.querySelector(s);
let tab='g1a',reveal=0,timer={sec:600,run:false,end:0,iv:null,sel:10};
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function ladder(g){return '<div class="ladder">'+[1,2,3,4,5,6].map(r=>`<span>${r}등 <b>${tbl(g)[r]}점</b></span>`).join('')+'</div>'}
function rankOpts(v){return '<option value="0">순위 선택</option>'+[1,2,3,4,5,6].map(r=>`<option value="${r}" ${v==r?'selected':''}>${r}등</option>`).join('')}
function gameView(g){
  const b=g==='g1b';
  let h=`<h1>${GAMES[g]}</h1><div class="sub">순위를 고르면 점수가 자동으로 들어가요</div>${ladder(g)}`;
  for(let i=0;i<6;i++){
    h+=`<div class="row ${b?'g1b':''}"><div class="dot" style="background:${COL[i]}"></div>`+
    (b?`<input type="text" data-n="${i}" value="${esc(S.names[i])}" placeholder="조 이름"><input type="text" data-s="${i}" value="${esc(S.slog[i])}" placeholder="조 구호">`
      :`<div style="font-size:22px;font-weight:900">${esc(S.names[i])}</div>`)+
    `<select data-g="${g}" data-i="${i}">${rankOpts(S.r[g][i])}</select><div class="pts">${pt(g,i)}<small> 점</small></div></div>`;
  }
  h+='<div class="warn" id="w"></div><div class="ctl"><button class="btn g" id="rs">순위 초기화</button></div>';
  $('#m').innerHTML=h;
  $('#m').querySelectorAll('select').forEach(el=>el.onchange=()=>{S.r[el.dataset.g][+el.dataset.i]=+el.value;save();gameView(g)});
  $('#m').querySelectorAll('[data-n]').forEach(el=>el.oninput=()=>{S.names[+el.dataset.n]=el.value;save()});
  $('#m').querySelectorAll('[data-s]').forEach(el=>el.oninput=()=>{S.slog[+el.dataset.s]=el.value;save()});
  $('#rs').onclick=()=>{S.r[g]=Array(6).fill(0);save();gameView(g)};
  const used={};S.r[g].forEach(v=>{if(v)used[v]=(used[v]||0)+1});
  const dup=Object.keys(used).filter(k=>used[k]>1);
  $('#w').textContent=dup.length?'⚠ '+dup.map(d=>d+'등').join(', ')+' 이(가) 중복이에요 (동점이면 그대로 두세요)':'';
}
function board(final){
  const rows=[0,1,2,3,4,5].map(i=>({i,t:tot(i,final)})).sort((a,b)=>b.t-a.t);
  let rank=0,prev=null;rows.forEach((r,k)=>{if(r.t!==prev){rank=k+1;prev=r.t}r.rank=rank});
  const mx=Math.max(1,...rows.map(r=>r.t));
  let h=`<h1>${final?'최종 집계':'중간 집계'}</h1><div class="sub">${final?'4개 게임 합산':'지금까지 점수'}</div>`;
  h+=`<table><tr><th>순위</th><th>조</th><th>무지개를<br>찾아라</th><th>이름<br>구호</th><th>이심<br>전심</th>${final?'<th>상상<br>네컷</th>':''}<th>누계</th></tr>`;
  rows.forEach((r,k)=>{
    const hide=final&&k<6-reveal;
    h+=`<tr class="${hide?'hide':''} ${final&&r.rank===1&&reveal>=6?'first':''}"><td class="rk">${r.rank}</td><td class="nm"><span class="chip" style="background:${COL[r.i]}"></span>${esc(S.names[r.i])}<div class="bar"><i style="width:${r.t/mx*100}%;background:${COL[r.i]}"></i></div></td><td>${pt('g1a',r.i)}</td><td>${pt('g1b',r.i)}</td><td>${pt('g2',r.i)}</td>${final?`<td>${pt('g3',r.i)}</td>`:''}<td class="tot">${r.t}</td></tr>`;
  });
  h+='</table>';
  if(final)h+=`<div class="ctl"><button class="btn y" id="rv">${reveal>=6?'순위 다시 숨기기':'다음 순위 공개 ▶'}</button><button class="btn" id="wb">🏆 우승팀 발표</button></div>`;
  $('#m').innerHTML=h;
  if(final){
    $('#rv').onclick=()=>{reveal=reveal>=6?0:reveal+1;if(reveal>0)chime();board(true)};
    $('#wb').onclick=()=>showWin();
  }
  return rows;
}
function fmt(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function timerView(){
  $('#m').innerHTML=`<div id="tm"><h1>☕ 쉬는 시간</h1><div class="sel"><button class="btn" data-m="10">10분</button><button class="btn" data-m="15">15분</button></div><div id="clock"></div><div class="ctl" style="justify-content:center"><button class="btn y" id="st">시작</button><button class="btn g" id="p1">+1분</button><button class="btn g" id="rt">처음으로</button></div></div>`;
  paint();
  $('#m').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>setT(+b.dataset.m));
  $('#st').onclick=()=>{if(timer.run){timer.sec=Math.max(0,(timer.end-Date.now())/1000);stop()}else{if(timer.sec<=0)timer.sec=timer.sel*60;timer.end=Date.now()+timer.sec*1000;timer.run=true;timer.iv=setInterval(tick,200);}paint()};
  $('#p1').onclick=()=>{if(timer.run)timer.end+=60000;else timer.sec+=60;paint()};
  $('#rt').onclick=()=>setT(timer.sel);
}
function stop(){timer.run=false;clearInterval(timer.iv)}
function setT(m){stop();timer.sel=m;timer.sec=m*60;paint()}
function tick(){const left=(timer.end-Date.now())/1000;if(left<=0){stop();timer.sec=0;beep();}paint()}
function paint(){
  const c=$('#clock');if(!c)return;
  const left=timer.run?(timer.end-Date.now())/1000:timer.sec;
  c.textContent=fmt(left);c.className=(left<=0)?'end':'';
  $('#st').textContent=timer.run?'일시정지':'시작';
  $('#m').querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on',+b.dataset.m===timer.sel));
}
function beep(){try{const a=new (window.AudioContext||window.webkitAudioContext)();[0,.5,1].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;o.connect(g);g.connect(a.destination);g.gain.setValueAtTime(.3,a.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+t+.4);o.start(a.currentTime+t);o.stop(a.currentTime+t+.45)})}catch(e){}}
/* winner */
function winners(){const rows=[0,1,2,3,4,5].map(i=>({i,t:tot(i,true)}));const m=Math.max(...rows.map(r=>r.t));return rows.filter(r=>r.t===m).map(r=>S.names[r.i])}
function showWin(){
  const w=$('#win');w.classList.remove('show','go');
  $('#wn').innerHTML='<small>🏆 우승</small>'+esc(winners().join(' · '));
  void w.offsetWidth;w.classList.add('show');setTimeout(()=>{w.classList.add('go');confetti();fanfare()},50);
}
$('#win').onclick=()=>{$('#win').classList.remove('show','go');cfOn=false;if(location.hash==='#win')location.hash='#final'};
let cfOn=false;
function confetti(){
  const c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;cfOn=true;
  const P=Array.from({length:140},()=>({x:Math.random()*c.width,y:-Math.random()*c.height,v:2+Math.random()*4,s:6+Math.random()*8,c:COL[Math.floor(Math.random()*6)],r:Math.random()*6}));
  (function f(){if(!cfOn){x.clearRect(0,0,c.width,c.height);return}x.clearRect(0,0,c.width,c.height);
    P.forEach(p=>{p.y+=p.v;p.r+=.1;if(p.y>c.height){p.y=-10;p.x=Math.random()*c.width}x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    requestAnimationFrame(f)})();
}

/* FANF: 우승 팡파르 + 순위 공개 효과음 */
let AC2=null;
function initA2(){if(!AC2){try{AC2=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC2&&AC2.state==='suspended')AC2.resume();}
document.addEventListener('pointerdown',initA2);
function horn(f,t,d,v){if(!AC2)return;const t0=AC2.currentTime+t,g=AC2.createGain();g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.04);g.gain.setValueAtTime(v,t0+d-.1);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  const flt=AC2.createBiquadFilter();flt.type='lowpass';flt.frequency.value=2400;flt.connect(g);g.connect(AC2.destination);
  const o=AC2.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(flt);o.start(t0);o.stop(t0+d+.05);}
function fanfare(){initA2();if(!AC2)return;
  [0,.2,.4].forEach(t=>{horn(392,t,.15,.1);horn(196,t,.15,.06)});
  horn(523,.6,.55,.1);horn(330,.6,.55,.06);
  [0,.2,.4].forEach(t=>{horn(659,1.25+t,.15,.1)});
  [523,659,784,1047].forEach(f=>horn(f,1.95,1.8,.09));horn(131,1.95,1.8,.1);
  const n=AC2.sampleRate*1.2,b=AC2.createBuffer(1,n,AC2.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.exp(-3.5*i/n);
  const s=AC2.createBufferSource(),g=AC2.createGain(),hp=AC2.createBiquadFilter();hp.type='highpass';hp.frequency.value=5000;g.gain.value=.12;s.buffer=b;s.connect(hp);hp.connect(g);g.connect(AC2.destination);s.start(AC2.currentTime+1.95);
  [1568,1976,2349,2637].forEach((f,i)=>{const o=AC2.createOscillator(),g2=AC2.createGain(),t0=AC2.currentTime+2.3+i*.1;o.frequency.value=f;g2.gain.setValueAtTime(.06,t0);g2.gain.exponentialRampToValueAtTime(.0001,t0+.5);o.connect(g2);g2.connect(AC2.destination);o.start(t0);o.stop(t0+.55)});}
function chime(){initA2();if(!AC2)return;[880,1175].forEach((f,i)=>{const o=AC2.createOscillator(),g=AC2.createGain(),t0=AC2.currentTime+i*.08;o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.09,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.4);o.connect(g);g.connect(AC2.destination);o.start(t0);o.stop(t0+.45)})}

function render(){
  const h=(location.hash||'#g1a').slice(1);
  let t=h;
  if(h==='timer10'){timer.sel=10;if(!timer.run)timer.sec=600;t='timer'}
  if(h==='timer15'){timer.sel=15;if(!timer.run)timer.sec=900;t='timer'}
  if(h==='win')t='final';
  tab=t;
  if(h!=='win'){$('#win').classList.remove('show','go');cfOn=false}
  document.querySelectorAll('#bar a').forEach(a=>a.classList.toggle('on',a.dataset.t===t));
  if(GAMES[t])gameView(t);
  else if(t==='timer')timerView();
  else if(t==='mid')board(false);
  else if(t==='final'){board(true);}
  else gameView('g1a');
  if(h==='win')showWin();
}
window.addEventListener('hashchange',render);
render();
</script></body></html>
