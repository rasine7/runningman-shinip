<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이심전심 게임 - 대표 뽑기</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#222;font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;display:flex;justify-content:center}
#c{width:100%;max-width:560px;min-height:100vh;background:#FFF4CC;padding:22px 16px 40px}
h1{font-size:clamp(34px,10vw,56px);text-align:center;font-weight:900;color:#222;line-height:1.1}
h1 span{background:#FF5A4F;color:#fff;padding:0 10px;border-radius:10px;display:inline-block;transform:rotate(-2deg)}
.sub{text-align:center;font-size:clamp(14px,4vw,18px);font-weight:700;margin:8px 0 18px;color:#444}
#picker{background:#E8F4FF;border:4px solid #222;border-radius:20px;padding:16px;box-shadow:5px 5px 0 #222;text-align:center}
#picker h2{font-size:clamp(22px,6.4vw,28px);font-weight:900}
#picker .hint{font-size:14px;font-weight:600;color:#555;margin:4px 0 10px}
.tog{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.tog button{font:inherit;font-size:16px;font-weight:900;padding:6px 18px;border:3px solid #222;border-radius:20px;background:#fff;color:#222;cursor:pointer}
.tog button.on{background:#FFD84D}
.room{--s:clamp(74px,24vw,104px);width:calc(var(--s)*2 + 52px);margin:0 auto;display:flex;flex-wrap:wrap;gap:12px}
.dk{background:#C8935A;border:4px solid #222;border-radius:14px;display:flex;align-items:center;justify-content:space-around;padding:6px;box-shadow:3px 3px 0 #222}
.dk.v{flex-direction:column;width:calc(var(--s) + 20px);height:calc(var(--s)*2 + 32px)}
.dk.h{flex-direction:row;width:100%;height:calc(var(--s) + 20px)}
.front{width:100%;text-align:center;font-size:13px;font-weight:800;color:#888;margin-bottom:-4px}
.seat{width:var(--s);height:var(--s);border:4px solid #222;border-radius:50%;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:clamp(18px,5vw,24px);transition:background .08s,transform .08s}
.seat span{font-size:clamp(26px,8vw,40px);line-height:1}
.seat.hot{background:#FFD84D;transform:scale(1.1)}
.seat.win1{background:#E5322D;color:#fff;transform:scale(1.08);animation:pop .6s ease infinite alternate}
.seat.off{visibility:hidden}
@keyframes pop{to{transform:scale(1.14)}}
.go{margin-top:14px;font:inherit;font-size:clamp(22px,6.4vw,28px);font-weight:900;color:#fff;background:#E5322D;border:4px solid #222;border-radius:16px;padding:10px 26px;box-shadow:4px 4px 0 #222;cursor:pointer;width:100%;max-width:400px}
.go:active{transform:translate(3px,3px);box-shadow:1px 1px 0 #222}
.go[disabled]{opacity:.6}
#res{margin-top:12px;min-height:40px;font-size:clamp(22px,6.4vw,30px);font-weight:900;color:#E5322D}
</style></head>
<body><div id="c">
<h1>이심전심 <span>게임!</span></h1>
<div class="sub">우리 조 대표는 누구?</div>
<div id="picker">
 <div class="room">
  <div class="dk v"><div class="seat"><span>😄</span></div><div class="seat"><span>😍</span></div></div>
  <div class="dk v"><div class="seat"><span>😜</span></div><div class="seat"><span>😎</span></div></div>
  <div class="dk h"><div class="seat"><span>🥰</span></div><div class="seat"><span>🤪</span></div></div>
 </div>
 <button class="go" id="go">🎤 대표 뽑기!</button>
 <div id="res"></div>
</div>
</div>
<script>

/* ===== 효과음 (잔잔한 WebAudio, 파일 불필요) ===== */
const SFXP=1;let AC=null;
function initA(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();}
function tn(f,d,type,v,delay,to){if(!AC)return;const t0=AC.currentTime+(delay||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.setValueAtTime(f,t0);if(to)o.frequency.exponentialRampToValueAtTime(to,t0+d);g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t0+d);o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+d+.03);}
function sPress(){tn(330,.12,'sine',.12,0,660)}
function sTick(p){tn(520+p*380,.07,'triangle',.07)}
function sWin(){[784,988,1175,1568].forEach((f,i)=>tn(f,.5,'sine',.1,i*.09));tn(392,.9,'triangle',.07,0)}

const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const n=6; let busy=false;
function rnd(k){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%k;}
function clearSeats(){$$('.seat').forEach(s=>s.classList.remove('hot','win1'));}
$('#go').onclick=()=>{
  if(busy)return;initA();sPress();busy=true;$('#go').disabled=true;clearSeats();$('#res').textContent='';
  const seats=$$('.seat').slice(0,n), win=rnd(n), total=n*3+win+1;
  let step=0, prev=-1;
  (function tick(){
    if(prev>=0)seats[prev].classList.remove('hot');
    const cur=step%n; seats[cur].classList.add('hot'); prev=cur; step++;
    if(step<=total)sTick(step/total);
    if(step>total){seats[cur].classList.remove('hot');seats[cur].classList.add('win1');sWin();
      $('#res').textContent='🎤 대표 당첨! '+seats[cur].querySelector('span').textContent;busy=false;$('#go').disabled=false;$('#go').textContent='🔄 다시 뽑기';return;}
    const left=total-step; setTimeout(tick, left<6?260+(6-left)*60:70);
  })();
};
</script></body></html>
